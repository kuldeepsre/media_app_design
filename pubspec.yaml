version: 1.0.0+1

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.13.1
  image: ^4.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  video_player: ^2.9.0
  gal: ^2.3.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/filters/2d/
    - assets/filters/3d/
    - assets/fx/